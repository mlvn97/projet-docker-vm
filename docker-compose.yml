services:
  prometheus:
    image: prom/prometheus:v3.15.0  # Set version to avoid compatibility problems
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    expose:
      - "9090"  # Not published on the host, only reachable from the "monitoring" network
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.3 # Set version to avoid compatibility problems
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false  # No registration for identity control
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_IP}:10300:3000" # Forward 3000 to 10300 to avoid using default port
    depends_on:
      - prometheus
    networks:
      - monitoring
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKER_IMAGE:-projet-vm:local}
    build:
      context: ./projet-vm
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${DOCKER_IMAGE_WEB:-projet-vm-web:local}
    build:
      context: ./projet-vm-web
    ports:
      - "${WEB_HOST_PORT:-8000}:80"

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        
        # Add your own targets using this template : 
        # - job_name: my-app
        #   static_configs:
        #     - targets: ["my-app:port"]

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:

networks:
  monitoring:
