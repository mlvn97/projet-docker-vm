services:
  prometheus:
    image: prom/prometheus:v3.15.0  # Set version to avoid compatibility problems
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    expose:
      - "9090"  # Not published on the host, only reachable from the "monitoring" network
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.3 # Set version to avoid compatibility problems
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false  # No registration for identity control
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_IP}:10300:3000" # Forward 3000 to 10300 to avoid using default port
    depends_on:
      - prometheus
    networks:
      - monitoring

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        
        # Add your own targets using this template : 
        # - job_name: my-app
        #   static_configs:
        #     - targets: ["my-app:port"]

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
