global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # "api" = nom du service Java dans le docker-compose.yml principal, à adapter si besoin
  - job_name: projet-vm-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
